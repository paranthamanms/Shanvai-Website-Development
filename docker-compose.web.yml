# Shanvai Technologies — POD name: ST
# Always-on (restart: unless-stopped). Independent of Credit Bureau (CB) scale-down.
name: st

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: shanvai/www:local
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.shanvai.com}
    labels:
      shanvai.pod: ST
      shanvai.app: shanvai-technologies
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
