services:
  postgres:
    image: postgres:16-alpine
    container_name: shanvai-postgres
    environment:
      POSTGRES_USER: shanvai
      POSTGRES_PASSWORD: shanvai
      POSTGRES_DB: shanvai
    ports:
      # Host 5433 avoids clash with local/other Postgres on 5432
      - "5433:5432"
    volumes:
      - shanvai_pg_data:/var/lib/postgresql/data
      - ./db/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shanvai -d shanvai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/analytics-lead
      dockerfile: Dockerfile
    container_name: shanvai-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://shanvai:shanvai@postgres:5432/shanvai
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      AI_PROVIDER: stub
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # For local MFE development prefer `npm run dev` in apps/*.
  # Optional preview containers can be added once images are published.

volumes:
  shanvai_pg_data:
